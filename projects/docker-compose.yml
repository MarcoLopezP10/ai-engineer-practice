version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-dev
    environment:
      POSTGRES_USER: marcolopez232
      POSTGRES_PASSWORD: Marco2004
      POSTGRES_DB: ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marcolopez232"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: